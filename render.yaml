# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: lingora
    runtime: docker
    region: singapore        # next to the Supabase database (ap-southeast-1)
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # Supabase Session pooler. Only the password is secret: type it in the Render dashboard.
      - key: LINGORA_DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: LINGORA_DB_USER
        value: postgres.ziyednpoiwrmcpastiib
      - key: LINGORA_DB_PASSWORD
        sync: false
      - key: LINGORA_SECRET_KEY
        generateValue: true    # long random value created by Render
      - key: LINGORA_ALLOWED_ORIGINS
        value: ""              # the service's own https URL is added automatically
      - key: LINGORA_GOOGLE_CLIENT_ID
        sync: false            # optional: Google Cloud -> OAuth client (Web)
      - key: LINGORA_GOOGLE_CLIENT_SECRET
        sync: false
      - key: LINGORA_TELEGRAM_BOT_TOKEN
        sync: false            # optional: @BotFather token; set the bot domain with /setdomain
