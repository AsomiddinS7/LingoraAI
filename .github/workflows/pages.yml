name: Deploy Lingora to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_RECOGNIZER: motion
      VITE_LLM_PROVIDER: local
      VITE_MOCK_AZURE: 'true'
      VITE_FACE_HINTS: 'off'
      # These committed assets are checked before and after the build. Public
      # Pages builds must never depend on an ignored local training artifact.
      VITE_MOTION_MODEL_URL: model/trained-sign-model.json
      VITE_SIGNED_SPEECH_MODEL_URL: model/signed-speech-model.json
      VITE_STT_PROVIDER: ${{ vars.LINGORA_SPEECH_TOKEN_URL && 'azure-speech' || 'browser-speech' }}
      VITE_TTS_PROVIDER: ${{ vars.LINGORA_SPEECH_TOKEN_URL && 'azure-speech' || 'browser-synthesis' }}
      VITE_SPEECH_TOKEN_URL: ${{ vars.LINGORA_SPEECH_TOKEN_URL }}
      # A static website cannot start a Python service on visitors' computers.
      VITE_LOCAL_STT_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check committed public assets and hosting configuration
        run: node scripts/check-deployment.mjs
      - run: npm test
      - name: Check model, speech and deployment tools
        run: >-
          node --test
          tests/training-export.test.mjs
          tests/model-provenance.test.mjs
          tests/temporal-inference.test.mjs
          tests/quantize-motion.test.mjs
          tests/masked-dtw.test.mjs
          tests/sign-dataset.test.mjs
          tests/skeletal-inference.test.mjs
          tests/speech-server.test.mjs
          tests/speech-readiness.test.mjs
          tests/deployment.test.mjs
      - run: npm run build
      - name: Verify the actual Pages artifact
        run: node scripts/check-deployment.mjs --built
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  speech-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight speech test dependencies
        run: python -m pip install 'numpy>=2,<3' 'huggingface_hub>=0.34,<2'
      - name: Check local speech protocols and offline model resolution
        run: python -m unittest discover -s tools/speech -p 'test*.py'

  deploy:
    needs: [build, speech-checks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
