name: Backend tests

on:
  push:
    branches: [main]
    paths: ['backend/**', 'src/api/seed/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'src/api/seed/**']

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lingora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      LINGORA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/lingora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
