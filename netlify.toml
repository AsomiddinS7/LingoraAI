[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_SIGN_CLASSIFIER = "mediapipe"

[[headers]]
  for = "/*"
  [headers.values]
    # 'wasm-unsafe-eval' lets MediaPipe compile its WebAssembly; blob: covers its worker/model buffers.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https: blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/model/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
